name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'website/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'website/**'
      - 'docs/**'

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    - name: Fix
      run: go fix -diff ./...

    - name: Test
      run: go test -race ./...

    - name: Check go.mod and go.sum are tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum
